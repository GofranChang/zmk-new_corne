---
include:
  # No dongle build: left is central, right is peripheral.
  - board: eyelash_corne_left
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_left_no_dongle_studio

  - board: eyelash_corne_right
    shield: nice_view
    artifact-name: eyelash_corne_right_no_dongle

  # Dongle build: nice!nano dongle is central, both halves are peripherals.
  - board: nice_nano_v2
    shield: eyelash_corne_central_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_dongle_studio

  - board: eyelash_corne_peripheral_left
    shield: nice_view
    artifact-name: eyelash_corne_left_for_dongle

  - board: eyelash_corne_peripheral_right
    shield: nice_view
    artifact-name: eyelash_corne_right_for_dongle

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset_nice_nano_v2
