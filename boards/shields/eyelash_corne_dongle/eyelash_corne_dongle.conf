# Dongle central config for nice!nano v2 + OLED.
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_INPUT=y

# Dongle is split central. Left/right halves are peripherals.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# BLE / USB behavior.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# OLED display on dongle.
CONFIG_ZMK_DISPLAY=y
CONFIG_SH1106=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_VDB_SIZE=64
CONFIG_LV_DPI_DEF=148

# Dongle has no keyboard backlight / underglow hardware.
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Keep ext power off on the dongle; it does not drive the keyboard LEDs.
CONFIG_ZMK_EXT_POWER=n
